plugins {
    id 'net.neoforged.moddev' version '2.0.74'
}

version = mod_version
group = mod_group

base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def mcVer = project.findProperty('minecraft_version_range')?.replaceAll('[\\[\\]()]', '') ?: '1.21.1'

neoForge {
    version = "21.1.93"

    runs {
        client {
            client()
            gameDirectory = file("run/${mcVer}/main_client")
            programArgument "--username=MainDev"
            jvmArgument "-Xms512m"
            jvmArgument "-Xmx2G"
            jvmArgument "-XX:+UseG1GC"
            jvmArgument "-Dfile.encoding=UTF-8"
        }
        client2 {
            client()
            gameDirectory = file("run/${mcVer}/off_client")
            programArgument "--username=AltDev"
            jvmArgument "-Xms512m"
            jvmArgument "-Xmx2G"
            jvmArgument "-XX:+UseG1GC"
            jvmArgument "-Dfile.encoding=UTF-8"
        }
        server {
            server()
            gameDirectory = file("run/${mcVer}/server")
            programArgument "--nogui"
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        // CONFIGS GENERAL
        loader_version_range: loader_version_range,
        neo_version_range: neo_version_range,
        minecraft_version_range: minecraft_version_range,
        // CONFIGS MOD
        mod_version: mod_version,
        mod_id: mod_id,
        mod_group: mod_group,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: mod_description,
        logo_file: logo_file,
        // CONFIGS LIBS
        attribute_lib_version: attribute_lib_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'sirgrantd.gradle'